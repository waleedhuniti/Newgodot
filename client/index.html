<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Creature MMO — client</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0a0a12; font-family: system-ui, sans-serif; }
    #app { position: relative; width: 100vw; height: 100vh; }
    canvas { display: block; }

    #login {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      background: rgba(10,10,18,0.9); z-index: 10;
    }
    #login form {
      background: #16161f; padding: 24px 28px; border-radius: 8px; display: flex; flex-direction: column; gap: 10px;
      width: 280px; color: #eee; border: 1px solid #2a2a3a;
    }
    #login h1 { font-size: 16px; margin: 0 0 8px; color: #e5484d; }
    #login input, #login button { padding: 8px 10px; border-radius: 4px; border: 1px solid #333; background: #0e0e16; color: #eee; font-size: 14px; }
    #login button { background: #e5484d; border: none; cursor: pointer; font-weight: 600; }
    #login button:hover { background: #ff5f64; }
    #login .error { color: #ff8a8a; font-size: 12px; min-height: 14px; }
    #login .hint { color: #888; font-size: 11px; }

    #hud {
      position: absolute; top: 10px; left: 10px; color: #eee; font-size: 12px;
      background: rgba(0,0,0,0.4); padding: 8px 10px; border-radius: 4px; z-index: 5; line-height: 1.5;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="login">
      <form id="login-form">
        <h1>CREATURE MMO — dev client</h1>
        <input id="email" type="email" placeholder="email" value="waleed@example.com" />
        <input id="password" type="password" placeholder="password" value="testpass123" />
        <input id="charname" type="text" placeholder="character name (for new account)" value="Anchor" />
        <button type="submit">Log in / Register + Enter World</button>
        <div class="error" id="login-error"></div>
        <div class="hint">WASD to move once in-world.</div>
      </form>
    </div>
    <div id="hud" style="display:none">
      <div id="hud-name"></div>
      <div id="hud-players"></div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
